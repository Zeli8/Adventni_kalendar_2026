
name: Deploy Adventni kalendar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stazeni kodu
        uses: actions/checkout@v4

      - name: Nastaveni Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace zavislosti
        run: npm ci

      - name: Sestaveni aplikace
        run: npm run build

      - name: Priprava GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrani webu
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Zverejneni webu
        id: deployment
        uses: actions/deploy-pages@v4
